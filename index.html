<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>DevFolio | Future Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Outfit:wght@300;400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #000000; /* Pure black */
        color: #f8fafc;
        overflow: hidden;
      }
      /* Tech/Futuristic Font */
      .font-tech {
        font-family: 'Syncopate', sans-serif;
      }
      /* Luxury Editorial Font (Kepler Alternative) */
      .font-editorial {
        font-family: 'Bodoni Moda', serif;
        font-style: italic;
        font-weight: 600; /* Medium/SemiBold feel */
      }
      
      h1, h2, h3 {
        /* Default to editorial for headings unless specified */
        font-family: 'Bodoni Moda', serif;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4);
      }
      
      .glass-panel {
        background: rgba(10, 10, 15, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
